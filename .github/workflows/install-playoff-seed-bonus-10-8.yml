name: Install playoff seed bonus 10-8

on:
  push:
    paths:
      - 'patch_playoff_seed_bonus_10_8.py'
      - '.github/workflows/install-playoff-seed-bonus-10-8.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply playoff seed bonus change
        run: python patch_playoff_seed_bonus_10_8.py
      - name: Commit installed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postseason.js index.html app_update.js app-version.json database/playoff_seed_bonus_10_8_7_5_4_3_2_0.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Set playoff seed bonuses to 10 8 7 5 4 3 2 0"
            git push
          fi
