name: Install finish week controls

on:
  push:
    paths:
      - 'finish_week_controls.js'
      - 'patch_finish_week_controls.py'
      - '.github/workflows/install-finish-week-controls.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python patch_finish_week_controls.py
      - name: Syntax check
        run: |
          node --check finish_week_controls.js
          node --check app_update.js
      - name: Commit installed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app_update.js app-version.json
          if git diff --cached --quiet; then
            echo "No install changes needed"
          else
            git commit -m "Load finish week controls"
            git push
          fi
