name: Install weekly standings upgrade

on:
  push:
    paths:
      - 'weekly_standings_v2.js'
      - 'patch_weekly_standings.py'
      - '.github/workflows/install-weekly-standings.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python patch_weekly_standings.py
      - name: Syntax check
        run: |
          node --check weekly_standings_v2.js
          node --check app_update.js
      - name: Commit installed upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app_update.js app-version.json
          if git diff --cached --quiet; then
            echo "No install changes needed"
          else
            git commit -m "Load tiebreaker-aware weekly standings"
            git push
          fi
