name: League checks

on:
  pull_request:
  push:
    branches: [main, feature/postseason-ready]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/postseason-test" --no-save --package-lock=false @electric-sql/pglite@0.5.8
      - name: Check app assets, login/session behavior, mobile layout, and legacy installers
        run: node --test tests/auth_session.test.cjs tests/mobile_layout.test.cjs tests/league_surface.test.cjs tests/path_to_win.test.cjs tests/share_grid.test.cjs tests/weekly_standings.test.cjs && node tests/release_check.mjs
      - name: Check championship odds, weekly odds, popups, and mobile-grid regressions
        run: node --test tests/championship_odds_model.test.cjs tests/championship_odds_integration.test.cjs tests/playoff_advancement_model.test.cjs tests/weekly_win_odds_model.test.cjs tests/mobile_grid_scroll_regression.test.cjs tests/opening_reveals.test.cjs tests/playoff_race_model.test.cjs tests/playoff_race_ui.test.cjs tests/championship_history_model.test.cjs tests/championship_history_ui.test.cjs tests/league_news_model.test.cjs tests/league_news_ui.test.cjs tests/ltspn_editorial_model.test.cjs tests/ltspn_editorial_ui.test.cjs
      - name: Verify Championship GameDay, advanced player profiles, SportsCenter and Hall of Fame
        run: node --test tests/league_extras_model.test.cjs tests/league_extras_ui.test.cjs
      - name: Verify five-destination mobile navigation and accessible More menu
        run: node --test tests/mobile_navigation.test.cjs
      - name: Verify all member names display as First Last without changing login identities
        run: node --test tests/member_names.test.cjs
      - name: Verify regular-season scoring and database behavior
        run: PGLITE_MODULE="$RUNNER_TEMP/postseason-test/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/regular_scoring.test.cjs tests/regular_db.test.mjs
      - name: Verify live scores, GameDay, and postseason behavior
        run: PGLITE_MODULE="$RUNNER_TEMP/postseason-test/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/live_scores.test.cjs tests/gameday_model.test.cjs tests/postseason_db.test.mjs
