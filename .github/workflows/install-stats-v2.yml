name: Install standings and stats upgrade

on:
  push:
    paths:
      - '.github/workflows/install-stats-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stats upgrade
        run: python install_stats_v2.py
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade standings and stats views"
          git push
