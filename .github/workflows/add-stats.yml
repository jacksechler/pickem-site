name: Add Stats Page
on:
  push:
    paths:
      - '.github/workflows/add-stats.yml'
permissions:
  contents: write
jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Stats page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<button class="navbtn" data-page="standings" onclick="showPage(\'standings\',this)">Standings</button><button id="commNav"', '<button class="navbtn" data-page="standings" onclick="showPage(\'standings\',this)">Standings</button><button class="navbtn" data-page="stats" onclick="showPage(\'stats\',this)">Stats</button><button id="commNav"')
          s=s.replace('<section id="standings" class="page hidden"><div class="hero"><div><div class="eyebrow">2026 SEASON</div><h1>Standings</h1></div></div><div id="standingsBox" class="card"></div></section>\n<section id="commissioner"', '<section id="standings" class="page hidden"><div class="hero"><div><div class="eyebrow">2026 SEASON</div><h1>Standings</h1></div></div><div id="standingsBox" class="card"></div></section>\n<section id="stats" class="page hidden"><div class="hero"><div><div class="eyebrow">YOUR 2026 SEASON</div><h1>Stats</h1><div class="muted">Your season performance updates after each week is scored and published.</div></div></div><div id="statsBox"></div></section>\n<section id="commissioner"')
          s=s.replace('renderHome();renderStandings();}catch(e)', 'renderHome();renderStandings();renderStats();}catch(e)')
          s=s.replace("if(id==='standings')renderStandings();if(id==='commissioner')renderCommissioner();", "if(id==='standings')renderStandings();if(id==='stats')renderStats();if(id==='commissioner')renderCommissioner();")
          stats = r'''async function renderStats(){if(!session)return;const box=el('statsBox');if(!box)return;try{const scores=await db('week_scores?user_id=eq.'+session.user.id+'&select=*'),weeks=await db('weeks?select=id,number,name'),weekMap={};weeks.forEach(w=>weekMap[w.id]=w);if(!scores.length){box.innerHTML='<div class="card"><h2>No published stats yet</h2><p class="muted">Your stats will appear here after the first week is scored and published.</p></div>';return;}const n=v=>Number(v||0),fmt=v=>Number(v).toFixed(1).replace(/\.0$/,'');const totalPoints=scores.reduce((a,s)=>a+n(s.total_points),0),correct=scores.reduce((a,s)=>a+n(s.correct_count),0),questionsTotal=scores.reduce((a,s)=>a+n(s.question_count),0),pickRate=questionsTotal?correct/questionsTotal*100:0,wins=scores.filter(s=>n(s.placement)===1).length,perfect=scores.filter(s=>n(s.question_count)>0&&n(s.correct_count)===n(s.question_count)).length,unicorns=scores.reduce((a,s)=>a+n(s.unicorn_count),0),upsets=scores.reduce((a,s)=>a+n(s.upset_count),0),longest=Math.max(0,...scores.map(s=>n(s.opening_streak))),pcts=scores.map(s=>s.pick_percentage!=null?n(s.pick_percentage):(n(s.question_count)?n(s.correct_count)/n(s.question_count)*100:0)),best=Math.max(...pcts),worst=Math.min(...pcts);let h='<div class="grid three"><div class="card"><div class="muted">Season Points</div><div class="big">'+fmt(totalPoints)+'</div></div><div class="card"><div class="muted">Pick Rate</div><div class="big">'+pickRate.toFixed(1)+'%</div></div><div class="card"><div class="muted">Correct Picks</div><div class="big">'+correct+'/'+questionsTotal+'</div></div><div class="card"><div class="muted">Weekly Wins</div><div class="big">'+wins+'</div></div><div class="card"><div class="muted">Perfect Rounds</div><div class="big">'+perfect+'</div></div><div class="card"><div class="muted">Unicorns</div><div class="big">'+unicorns+'</div></div><div class="card"><div class="muted">Upsets</div><div class="big">'+upsets+'</div></div><div class="card"><div class="muted">Best / Worst Week</div><div class="big">'+best.toFixed(0)+'% / '+worst.toFixed(0)+'%</div></div><div class="card"><div class="muted">Longest Opening Streak</div><div class="big">'+longest+'</div></div></div>';const rows=[...scores].sort((a,b)=>n(weekMap[b.week_id]?.number)-n(weekMap[a.week_id]?.number));h+='<div class="card tablewrap"><h2>Week-by-Week</h2><table class="table"><thead><tr><th>Week</th><th>Finish</th><th>Correct</th><th>Pick %</th><th>Points</th></tr></thead><tbody>'+rows.map(r=>{const w=weekMap[r.week_id]||{},pct=r.pick_percentage!=null?n(r.pick_percentage):(n(r.question_count)?n(r.correct_count)/n(r.question_count)*100:0);return '<tr><td><b>'+esc(w.name||('Week '+(w.number||'')))+'</b></td><td>'+(r.placement?('#'+r.placement):'—')+'</td><td>'+n(r.correct_count)+'/'+n(r.question_count)+'</td><td>'+pct.toFixed(1)+'%</td><td><b>'+fmt(n(r.total_points))+'</b></td></tr>';}).join('')+'</tbody></table></div>';box.innerHTML=h;}catch(e){box.innerHTML='<div class="notice">Could not load stats yet.</div>';}}
'''
          s=s.replace('async function renderCommissioner(){', stats+'async function renderCommissioner(){')
          p.write_text(s)
          Path('.github/workflows/add-stats.yml').unlink()
          PY
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-stats.yml
          git commit -m "Add player stats page"
          git push
