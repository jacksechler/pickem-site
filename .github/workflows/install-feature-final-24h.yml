name: Install 24-hour final week feature

on:
  push:
    paths:
      - 'patch_feature_final_24h.py'
      - '.github/workflows/install-feature-final-24h.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python patch_feature_final_24h.py
      - name: Syntax check
        run: |
          node --check history_profiles.js
          node --check app_update.js
      - name: Commit installed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_profiles.js index.html app_update.js app-version.json
          if git diff --cached --quiet; then
            echo "No install changes needed"
          else
            git commit -m "Feature published week for 24 hours"
            git push
          fi
