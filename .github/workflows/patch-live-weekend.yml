name: Patch live weekend features

on:
  push:
    paths:
      - 'patch_live_weekend.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live weekend integration
        run: python patch_live_weekend.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html commissioner_v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire live weekend scoring into app"
          git push
