name: Install League mobile release

on:
  push:
    paths:
      - 'patch_league_ui_oct6.py'
      - '.github/workflows/install-league-ui-oct6.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply League and mobile fixes
        run: python patch_league_ui_oct6.py
      - name: Commit installed release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app_update.js app-version.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix League scrolling and restore Share Grid"
            git push
          fi
