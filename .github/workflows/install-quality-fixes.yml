name: Install quality fixes

on:
  push:
    paths:
      - 'patch_quality_fixes.py'
      - '.github/workflows/install-quality-fixes.yml'
      - 'quality_fixes.js'
      - 'notification_status.js'
      - 'app_update.js'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python patch_quality_fixes.py
      - name: Syntax check
        run: |
          node --check quality_fixes.js
          node --check notification_status.js
          node --check app_update.js
      - name: Commit installed scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No install changes needed"
          else
            git commit -m "Load weekend safety and polish fixes"
            git push
          fi
