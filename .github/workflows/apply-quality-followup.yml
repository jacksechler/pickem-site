name: Apply quality follow-up

on:
  push:
    paths:
      - 'patch_quality_followup.py'
      - '.github/workflows/apply-quality-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python patch_quality_followup.py
      - name: Syntax check
        run: |
          node --check quality_fixes.js
          node --check app_update.js
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality_fixes.js app_update.js
          if git diff --cached --quiet; then
            echo "No follow-up changes needed"
          else
            git commit -m "Finish update banner and mobile polish"
            git push
          fi
