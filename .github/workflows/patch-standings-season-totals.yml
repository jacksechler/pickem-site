name: Patch standings season totals

on:
  push:
    paths:
      - 'patch_standings_season_totals.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch standings
        run: python patch_standings_season_totals.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats_v2.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add season movement chart"
          git push
